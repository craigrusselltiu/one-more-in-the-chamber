<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Roguelike match-3 with trait synergies. A red panda cowboy's adventure." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OMITC" />
    <title>One More In The Chamber</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only register service worker in production (not dev server)
      if ('serviceWorker' in navigator && !window.location.port) {
        window.addEventListener('load', () => {
          // Use pathname to handle subpath deployments (e.g. GitHub Pages /repo-name/)
          var path = window.location.pathname;
          var base = path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1);
          navigator.serviceWorker.register(base + 'sw.js')
            .then((reg) => {
              setInterval(() => reg.update(), 30 * 60 * 1000);
            })
            .catch(() => {});
        });
      } else if ('serviceWorker' in navigator && window.location.port) {
        // Dev mode: unregister any existing service worker so it doesn't cache dev assets
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) reg.unregister();
        });
      }
    </script>
  </body>
</html>
